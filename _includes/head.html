<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060908">
{% if page.url == "/" %}{% assign page_title = "Zayeed Bin Kabir | Data Analytics & Builder" %}{% else %}{% assign page_title = page.title | append: " | Zayeed Bin Kabir" %}{% endif %}
{% assign page_desc = page.dek | default: page.description | default: site.description %}
<title>{{ page_title }}</title>
<meta name="description" content="{{ page_desc | strip_html | escape }}">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<meta property="og:type" content="{% if page.collection %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ page_title | escape }}">
<meta property="og:description" content="{{ page_desc | strip_html | escape }}">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:image" content="{{ site.url }}{{ page.og_image | default: page.cover | default: '/assets/vizora.webp' }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="alternate" type="application/rss+xml" title="Zayeed Bin Kabir: Writing" href="/feed.xml">
